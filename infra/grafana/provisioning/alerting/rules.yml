apiVersion: 1
groups:
    - orgId: 1
      name: Container
      folder: Folder
      interval: 1m
      rules:
        - uid: 992-gz_Dz
          title: Container CPU
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: |-
                    100 *
                    sum(
                      rate(
                        container_cpu_usage_seconds_total{
                          container_label_com_docker_compose_service=~"backend|database|reverse-proxy"
                        }[5m]
                      )
                    )
                    /
                    scalar(
                      count(
                        count by (cpu) (
                          node_cpu_seconds_total{mode="idle"}
                        )
                      )
                    )
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 10
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Alerting
          for: 1m
          annotations:
            summary: CPU利用率が増加しています
          isPaused: false
          notification_settings:
            receiver: discord
        - uid: afxjtl5t895hcc
          title: Container Memory
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: |-
                    sum by (container_label_com_docker_compose_service) (
                      container_memory_working_set_bytes{
                        container_label_com_docker_compose_service=~"backend|database|reverse-proxy"
                      }
                    )
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1.073741824e+09
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            summary: メモリ利用率が増加しています
          isPaused: false
          notification_settings:
            receiver: discord
