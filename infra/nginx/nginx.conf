load_module modules/ngx_http_modsecurity_module.so;

worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
	worker_connections 1024;
	multi_accept on;
	use epoll;
}

http {
	proxy_temp_path /tmp/proxy_temp;
	client_body_temp_path /tmp/client_temp;
	fastcgi_temp_path /tmp/fastcgi_temp;
	uwsgi_temp_path /tmp/uwsgi_temp;
	scgi_temp_path /tmp/scgi_temp;

  	server_tokens off;
  	sendfile on;
  	tcp_nopush on;
  	tcp_nodelay on;

  	include /etc/nginx/mime.types;
  	default_type  application/octet-stream;

	access_log off;

	absolute_redirect off;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	server {
		listen 8443 ssl;
		server_name localhost;
		http2 on;

		modsecurity on;
		modsecurity_rules_file /etc/modsecurity.d/setup.conf;

		add_header X-Frame-Options "SAMEORIGIN" always;
    	add_header X-XSS-Protection "1; mode=block" always;
    	add_header X-Content-Type-Options "nosniff" always;
    	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

		ssl_certificate /etc/nginx/ssl/server.crt;
		ssl_certificate_key /etc/nginx/ssl/server.key;

		ssl_session_timeout 1d;
		ssl_session_cache shared:SSL:1m;
		ssl_session_tickets off;

		ssl_protocols TLSv1.3;
		ssl_ecdh_curve X25519:prime256v1:secp384r1;
		ssl_prefer_server_ciphers off;

		gzip on;
		gzip_types text/css application/javascript application/json font/woff font/woff2 font/tff font/otf image/gif image/png image/jpeg image/webp application/octet-stream;
		gzip_comp_level 6;
		gzip_vary on;
		gzip_proxied any;

		client_max_body_size 5M;

		root /usr/share/nginx/html;
		index index.html;

		location = /healthz {
			access_log off;
			return 200 "ok\n";
		}

		# Backend
		location = /api/internal/tasks {
			modsecurity_rules 'SecRuleUpdateTargetById 942100 "!ARGS:json.description"';
			modsecurity_rules 'SecRuleUpdateTargetById 942100 "!ARGS:q"';
			modsecurity_rules 'SecRuleUpdateTargetById 942100 "!ARGS:json.title"';
			proxy_pass http://backend:3000;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-Host $host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		location /api/ {
			proxy_pass http://backend:3000;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-Host $host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		location /api {
			return 308 /api/;
		}

		location /grafana/ {
			proxy_pass http://grafana:3000;
			proxy_set_header Host $host;
		}

		location /grafana {
			return 308 /grafana/;
		}

		# Proxy Grafana Live WebSocket connections.
  		location /grafana/api/live/ {
    		proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
    		proxy_pass http://grafana:3000;
  		}

		location /kibana/ {
			proxy_pass http://kibana:5601;
			proxy_set_header Host $host;
		}

		location /kibana {
			return 308 /kibana/;
		}

		# Frontend
		location / {
			try_files $uri $uri/ /index.html;
        }
    }
}
