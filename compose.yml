name: ft_transcendence

x-workspace: &workspace
    image: ft_transcendence-workspace:dev
    build:
        context: .
        target: development
    init: true
    cap_drop:
        - ALL
    security_opt:
        - no-new-privileges:true

services:
    reverse-proxy:
        image: nginx:alpine
        volumes:
            - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        ports:
            - "127.0.0.1:8080:80"
        depends_on:
            - frontend
            - backend
        networks:
            - frontend
            - backend

    frontend:
        <<: *workspace
        command:
            - pnpm
            - --filter
            - frontend
            - dev
            - --host
            - 0.0.0.0
        develop:
            watch:
                - action: sync
                  path: ./apps/frontend
                  target: /workspace/apps/frontend
                  ignore:
                      - node_modules/
                      - package.json
                - action: rebuild
                  path: ./apps/frontend/package.json
                - action: rebuild
                  path: ./package.json
                - action: rebuild
                  path: ./pnpm-lock.yaml
                - action: rebuild
                  path: ./pnpm-workspace.yaml
        networks:
            - frontend

    backend:
        <<: *workspace
        command:
            - sh
            - -c
            - pnpm --filter backend db:migrate && pnpm --filter backend dev
        develop:
            watch:
                - action: sync
                  path: ./apps/backend
                  target: /workspace/apps/backend
                  ignore:
                      - node_modules/
                      - package.json
                - action: rebuild
                  path: ./apps/backend/package.json
                - action: rebuild
                  path: ./package.json
                - action: rebuild
                  path: ./pnpm-lock.yaml
                - action: rebuild
                  path: ./pnpm-workspace.yaml
        environment:
            DATABASE_URL: ${DATABASE_URL}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
            BETTER_AUTH_URL: ${BETTER_AUTH_URL}
        depends_on:
            database:
              condition: service_healthy
        networks:
            - backend
            - database

    database:
        image: postgres:18
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - database

networks:
    frontend:
    backend:
    database:

volumes:
    postgres-data:
