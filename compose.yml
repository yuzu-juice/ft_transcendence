name: ft_transcendence

x-workspace: &workspace
    image: ft_transcendence-workspace:dev
    build:
        context: .
        target: development
    init: true
    cap_drop:
        - ALL
    security_opt:
        - no-new-privileges:true

services:
    reverse-proxy:
        image: nginx:alpine
        restart: unless-stopped
        volumes:
            - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - frontend
            - backend

    frontend:
        <<: *workspace
        command:
            - pnpm
            - --filter
            - frontend
            - dev
            - --host
            - 0.0.0.0
        ports:
            - "127.0.0.1:5173:5173"
        develop:
            watch:
                - action: sync
                  path: ./apps/frontend
                  target: /workspace/apps/frontend
                  ignore:
                      - node_modules/
                      - package.json
                - action: rebuild
                  path: ./apps/frontend/package.json
                - action: rebuild
                  path: ./package.json
                - action: rebuild
                  path: ./pnpm-lock.yaml
                - action: rebuild
                  path: ./pnpm-workspace.yaml
        networks:
            - frontend

    backend:
        <<: *workspace
        command:
            - pnpm
            - --filter
            - backend
            - dev
            - --host
            - 0.0.0.0
        ports:
            - "127.0.0.1:3000:3000"
        develop:
            watch:
                - action: sync
                  path: ./apps/backend
                  target: /workspace/apps/backend
                  ignore:
                      - node_modules/
                      - package.json
                - action: rebuild
                  path: ./apps/backend/package.json
                - action: rebuild
                  path: ./package.json
                - action: rebuild
                  path: ./pnpm-lock.yaml
                - action: rebuild
                  path: ./pnpm-workspace.yaml
        networks:
            - backend

networks:
    frontend:
    backend:
