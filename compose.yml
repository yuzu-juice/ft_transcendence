name: ft_transcendence

x-backend-environment: &backend-environment
  DATABASE_URL: ${DATABASE_URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL}
  INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
  AVATAR_DIR: /data/avatars
  FORCE_COLOR: "1"

services:
  reverse-proxy:
    build:
      context: .
      target: reverse-proxy-production
    container_name: reverse-proxy
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/nginx/server.key:/etc/nginx/ssl/server.key:ro
      - ./secrets/nginx/server.crt:/etc/nginx/ssl/server.crt:ro
    ports:
      - "127.0.0.1:4443:443"
    depends_on:
      backend:
        condition: service_healthy
      grafana:
        condition: service_started
      kibana:
        condition: service_healthy
    networks:
      - backend
      - grafana
      - kibana
    restart: unless-stopped

  backend-init:
    build:
      context: .
      target: production
    container_name: backend-init
    command:
      - sh
      - -ec
      - |
        pnpm --filter @ft/backend db:migrate
        pnpm --filter @ft/backend db:bootstrap-admin
    environment:
      <<: *backend-environment
    volumes:
      - avatar-data:/data/avatars
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
      - database

  backend:
    build:
      context: .
      target: backend-production
    container_name: backend
    environment:
      <<: *backend-environment
    volumes:
      - avatar-data:/data/avatars
    depends_on:
      backend-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - backend
      - database
    logging:
      driver: gelf
      options:
        gelf-address: udp://127.0.0.1:12201
        gelf-compression-type: none
    restart: unless-stopped

  database:
    container_name: database
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
          - CMD-SHELL
          - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - database
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - 9100
    networks:
      - monitoring
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/run:/var/run:rw
      - /var/lib/docker:/var/lib/docker:ro
    expose:
      - "8080"
    networks:
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    expose:
      - 9090
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2
    container_name: grafana
    environment:
      - GF_SERVER_ROOT_URL=${BASE_URL}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_LOG_LEVEL=warn
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_DISCORD_WEBHOOK_URL=${GF_DISCORD_WEBHOOK_URL}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - 3000
    user: ":"
    networks:
      - monitoring
      - grafana
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    container_name: elasticsearch
    environment:
      - node.name=es01
      - discovery.type=single-node
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - path.repo=/usr/share/elasticsearch/snapshots
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - elasticsearch-snapshots:/usr/share/elasticsearch/snapshots
    expose:
      - 9200
    healthcheck:
      test:
        - CMD
        - curl
        - -fs
        - -u
        - elastic:${ELASTIC_PASSWORD}
        - localhost:9200/_cluster/health
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - elastic
    mem_limit: 2g
    restart: unless-stopped

  elasticsearch-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    container_name: elasticsearch-init
    user: root
    command: bash /init.sh
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
    volumes:
      - ./infra/elasticsearch/init.sh:/init.sh:ro
      - elasticsearch-snapshots:/usr/share/elasticsearch/snapshots
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elastic

  kibana:
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    image: docker.elastic.co/kibana/kibana:9.5.3
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
      - NODE_OPTIONS=--max-old-space-size=1024
    volumes:
      - ./infra/kibana/saved_objects.ndjson:/usr/share/kibana/saved_objects.ndjson:ro
    healthcheck:
      test:
        - CMD
        - curl
        - -fs
        - localhost:5601/kibana/api/status
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - elastic
      - kibana
    post_start:
      - command: >-
          curl -f --retry 10 --retry-delay 10 --retry-all-errors
          -u "elastic:${ELASTIC_PASSWORD}" -H "kbn-xsrf: true"
          --form file=@/usr/share/kibana/saved_objects.ndjson
          "http://localhost:5601/kibana/api/saved_objects/_import?overwrite=true"
    mem_limit: 2g
    restart: unless-stopped

  logstash:
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    image: docker.elastic.co/logstash/logstash:9.5.3
    container_name: logstash
    environment:
      - LS_JAVA_OPTS=-Xms1g -Xmx1g
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ./infra/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "127.0.0.1:12201:12201/udp"
    healthcheck:
      test:
        - CMD
        - curl
        - -fs
        - localhost:9600/_health_report
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - elastic
    mem_limit: 2g
    restart: unless-stopped

networks:
  backend:
  database:
  monitoring:
  grafana:
  elastic:
  kibana:

volumes:
  postgres-data:
  avatar-data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
  elasticsearch-snapshots:
